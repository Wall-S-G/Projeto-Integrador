<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        h1 {
            color: rgb(87, 18, 18);
            text-align: center; /* Centraliza o título */
        }
        
        body {
            background-image: url(https://giffiles.alphacoders.com/207/207978.gif);
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; /* Remove margens padrão */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centraliza horizontalmente */
            justify-content: center; /* Centraliza verticalmente */
        }
        
        /* Centraliza o parágrafo */
        p {
            text-align: center;
            margin: 5px 0;
        }
        
        /* Estiliza os botões */
        button {
            margin: 0 5px; /* Espaço entre os botões */
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        
        button:hover {
            background-color: rgba(255, 255, 255, 1);
        }
        
        /* Container para os botões (opcional) */
        .botoes {
            margin-bottom: 20px;
        }
        
        /* Centraliza a imagem */
        img {
            display: block;
            margin: 10px auto; /* Centraliza horizontalmente */
        }
    </style>
</head>
<body>
    <div class="botoes"> <!-- Container para organizar os botões -->
        <button><a href="inicio.html">Início</a></button>
        <button><a href="sobre.html">Sobre</a></button>
        <button><a href="contato.html">Contato</a></button>
    </div>
    
    <h1>Contato</h1>
    
    <img src="https://img.cdndsgni.com/preview/10000484.jpg" alt="Zap" width="50" height="50">
    
    <p style="color: rgb(12, 165, 12);"><b>Chama no zap: <br> (11) 9 4002-8922</b></p>
</body>
</html>
