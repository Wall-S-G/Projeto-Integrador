<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
    <style>
        body {
            background-color: lightskyblue;
        }
    </style>
</head>
<body>
    <h1 style="color: aquamarine;">Listas Ordeadas e Não Ordenadas</h1>
    <p>Os os elementos de lista HTML organiza conteúdos usando tags especificas:</p>
    <h2>Listas Não Ordenadas (Unodered List)</h2>
    <!-- Cria uma lista não ordenada, geralmente exibida com marcadores (bolinhas/círculos) -->
    <ul>
        <li>Maçâ</li>
        <li>Laranja</li>
        <li>melão</li>
        <li>Uva</li>
        <li>Kiwi</li>
    </ul>
    <h2>Listas Ordenadas (Ordered List)</h2>
    <!-- Cria uma Lista Ordenada, tipicamente numerada ou alfabética (1, 2, 3, ...; A, B, C, ...)-->
    <ol type="A">
        <li>Santos</li>
        <li>São Paulo</li>
        <li>Flamengo</li>
        <li>Coríntias</li>
        <li>Palmeiras</li>
    </ol>
</body>
</html>
