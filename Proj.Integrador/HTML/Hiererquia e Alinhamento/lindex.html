<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiererquia e Alinhamento</title>
</head>
<body>
    <h1>Hiererquia e Alinhamento</h1>
    <p>HTML deve ser bem estruturado, as tags precisam ser alinhadas corretamente:</p>

    <!-- CORRETO -->
    <p><strong>Texto importante</strong> dentro de um parágrafo</p>

    <!-- ERRADO -->
    <p><strong>Texto importante</p></strong>

</body>
</html>
