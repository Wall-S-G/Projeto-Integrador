<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributos Globais</title>
</head>
<body>
    <h1>Atributos Globais</h1>
    
    <!-- id - indentificador único -->
    <p id="mensagem">Olá, mundo</p>

    <!-- Class (Classe) - permite agrupar vários elementos com o mesmo estilo e comportamento. -->
    <p class="destaque">Torque não é presunto!</p>
    <p class="destaque">Outro texto importante!</p>

    <!-- style (texto inline) - Aplia CSS direto no elemento -->
    <h1 style="color: lightcoral;">Bah...</h1>

    <div>
        <p>Pamonha</p>
    </div>
    <div>
        <p>Requeijão</p>
    </div>
</body>
</html>
