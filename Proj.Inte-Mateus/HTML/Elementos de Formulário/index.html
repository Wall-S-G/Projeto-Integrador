<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Formulário</title>
</head>
<body>
    <h1>Elementos de Fómulário.</h1>
    <p>Os elementos de formulário em HTML permitem coletar dados do usuário (como: login, cadstro, pesquisa, etc.)</p>
    <p>
        <form>
            <fieldset>
                <legend style="text-align: center;">Contato</legend>
            </fieldset>

            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required><br>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required><br>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required><br>
            
            <button type="submit">Enviar</button>

        </form>

    </p>

</body>
</html>
