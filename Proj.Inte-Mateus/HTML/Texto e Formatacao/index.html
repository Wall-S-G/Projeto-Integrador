<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto e Formatação</title>
</head>
<body>
    <!-- Exemplo 01: Exibir texto em negrito -->
    <p>Usando a tag certa, você deixa seu texto <b>em negrito</b></p>
    <!-- Exemplo 02: Destacar partes do texto -->
    <p>A ultima palavra da frase é <strong>destacada</strong></p>
    <!-- Exemplo 03: destacar partes do texto -->
    <p>A palavra a seguir será exibida em <i>itálico</i></p>
    <!-- Exemplo 04: Sublinhar trechos de texto -->
    <p>Em diversas situações, é bom <u>sublinhar</u> uma palavra ou frase importante</p>
    <!-- Exemplo 05; Tachar plavras -->
    <p>Esta oferta é válida até <s>1° de Novembro</s></p>
</body>
</html>
