<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Tabela</title>
</head>
<body>
    <h1>Elementos de Tabela.</h1>
    <p>Os elementos de tabela emHTML são usados para organizar dados em linhas e colunas, como uma planilha.</p>

    <table style="text-align: center;" border="3">
        <caption>Tabela de produtos</caption>
        <thead style="color: rgb(rgb(219, 121, 121), rgb(111, 184, 111), rgb(63, 63, 163));">
            <tr>
                <th>Produto</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Teclado</td>
                <td>R$ 80,00</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>R$ 67,99</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>R$ 147,99</td>
            </tr>
        </tfoot>
    </table>
    <!-- table = Define uma tabela -->
    <!-- tr = (table Row) Define uma linha -->
    <!-- th = (Table Header) Define uma célula de cabeçalho -->
    <!-- td  (Table Data) Define uma célula comum -->
    <!-- thead, tbody, tfoot = Estrutura Semântica da tabela -->
</body>
</html>
